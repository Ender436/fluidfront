[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluidfront"
version = "0.0.1"
description = "Intuitive GPU CFD for hobbyists (FluidX3D engine + WebUI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "trimesh>=4.7",
    "imageio-ffmpeg>=0.6",
]

[project.optional-dependencies]
dev = [
    "httpx2>=0.28",  # needed by starlette's TestClient in the test suite
]

[tool.setuptools.packages.find]
include = ["fluidfront*"]
