[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluidfront"
version = "0.0.1"
description = "Intuitive GPU CFD for hobbyists (FluidX3D engine + WebUI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "trimesh>=4.7",
]

[tool.setuptools.packages.find]
include = ["fluidfront*"]
